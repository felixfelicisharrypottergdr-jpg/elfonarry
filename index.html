            if(mb.modalita==="all"&&bonusCount<postValidiMese){
              var excluded=el("div","cb-notes");
              excluded.appendChild(el("span","cb-notes-title","Post esclusi da "+narratorBonusName(mb,mbi)+":"));
              var anyExcluded=false;
              for(var ebx=0;ebx<postsMese.length;ebx++){
                var ebp=postsMese[ebx];
                if(ebp&&isValidPostLink(ebp.link)&&narratorPostExcluded(ebp,mb)){
                  anyExcluded=true;var exItem=el("div","cb-note-item");exItem.appendChild(document.createTextNode("Post "+(ebx+1)));
                  var exIcon=makeLinkIcon(ebp.link,"Apri il post escluso dal bonus");if(exIcon)exItem.appendChild(exIcon);excluded.appendChild(exItem);
                }
              }
              if(anyExcluded)info.appendChild(excluded);
            }

            if(mb.modalita==="posts"&&mb.valore==="variable"){
              for(var vr=0;vr<postsMese.length;vr++){
                var vp=postsMese[vr],rec=narratorUsageRecord(vp,mb);
                if(!vp||!isValidPostLink(vp.link)||!rec||!rec.used)continue;
                var rr=el("div","cb-note-item");
                var res=mb.variabileSu==="pp"?("+"+(parseInt(rec.pp,10)||0)+" PP"):(mb.variabileSu==="galeoni"?("+"+(parseInt(rec.galeoni,10)||0)+" G"):String(rec.altro||""));
                rr.appendChild(document.createTextNode("Post "+(vr+1)+": "+res+" "));
                var rollIcon=makeLinkIcon(rec.link,"Apri il tiro del Bonus");if(rollIcon)rr.appendChild(rollIcon);
                var missingRes=(mb.variabileSu==="pp"&&!((parseInt(rec.pp,10)||0)>0))||(mb.variabileSu==="galeoni"&&!((parseInt(rec.galeoni,10)||0)>0))||(mb.variabileSu==="altro"&&!String(rec.altro||"").trim());
                if(missingRes||!isValidPostLink(rec.link)){rr.appendChild(el("span","status-pending"," ⚠ "+(missingRes?"risultato ":"")+(missingRes&&!isValidPostLink(rec.link)?"e ":"")+(!isValidPostLink(rec.link)?"link tiro ":"")+"mancante")); }
                info.appendChild(rr);
              }
            }
          }

          for(var mbiSetup=0;mbiSetup<monthBonuses.length;mbiSetup++){
            var setupBonus=monthBonuses[mbiSetup];
            if(setupBonus.modalita==="posts" && (!setupBonus.usatiConfermati || !(setupBonus.maxUtilizzi>0))){
              info.appendChild(el("div","bag-update-warning",narratorBonusName(setupBonus,mbiSetup)+": stato iniziale del premio incompleto — il PG deve indicare quanti utilizzi risultano già consumati in Scheda PG e il totale previsto."));
            }
          }
          var bagWarnings=narratorBagWarnings(mese,postsMese);
          for(var bwi=0;bwi<bagWarnings.length;bwi++){
            info.appendChild(el("div",bagWarnings[bwi].kind==="remove"?"bag-remove-warning":"bag-update-warning",bagWarnings[bwi].text));
          }

          var notes = el("div", "cb-notes");
          notes.appendChild(el("span", "cb-notes-title", "Nota:"));
          var haNote = false;
          for(var n=0;n<postsMese.length;n++){
            var nota = postsMese[n] && postsMese[n].nota != null ? String(postsMese[n].nota).trim() : "";
            if(nota !== ""){
              haNote = true;
              var item = el("div", "cb-note-item");
              item.appendChild(document.createTextNode("Post " + (n + 1) + ": " + nota));
              var postIcon = makeLinkIcon(postsMese[n].link, "Apri il post");
              if(postIcon){ item.appendChild(postIcon); }
              notes.appendChild(item);
            }
          }
          if(!haNote){
            notes.appendChild(document.createTextNode(" \u2014"));
          }
          info.appendChild(notes);
          row.appendChild(info);

          var chk = el("div", "chk-line");
          if(isImportedStudentMonth(mese)){
            chk.appendChild(el("span","small-note","📦 Storico importato da Studente — nessun nuovo accredito richiesto"));
          }else{
            var box = el("input"); box.type="checkbox";
            var appliedEntry=findAppliedRecordEntryForMonth(accreditiData,mese,normalizeMonthName(mese.nome));
            box.checked = !!accreditiData[mese.id] || !!appliedEntry;
            var statusLbl = el("span", box.checked ? "status-ok" : "status-pending", box.checked ? "Accreditato" : "Da accreditare");
            if(!box.checked){
              var dueParts=[gMese+" G",ppMese+" PP"];
              var dueAltro=allBonusAltro(mese,postsMese);
              if(dueAltro){dueParts.push("Altro: "+dueAltro);}
              var currentStaffValues=(accreditiData._staffState&&accreditiData._staffState.values)||{};
              var dueSocial=socialLossPartsForSummary(tipoPg,validPostCount(postsMese),currentStaffValues);
              if(dueSocial.length){dueParts.push("Parametri Sociali: "+dueSocial.join(", "));}
              info.appendChild(el("div","credit-due-badge","DA ACCREDITARE: "+dueParts.join(" · ")));
            }
            box.addEventListener(EV, function(){
              var nuovoValore=box.checked,rk=monthRecordKey(mese),currentEntry=findAppliedRecordEntryForMonth(accreditiData,mese,normalizeMonthName(mese.nome)),stored=currentEntry?currentEntry.record:null,promise;
              box.disabled=true;
              if(nuovoValore && box._staffApply){promise=box._staffApply(true);}
              else if(!nuovoValore && stored && stored.applied!==false){
                var currentStaff=normalizeStaffValues(tipoPg,(accreditiData._staffState&&accreditiData._staffState.values)||{}),afterStaff=normalizeStaffValues(tipoPg,stored.after||{}),hasExternal=stableJson(currentStaff)!==stableJson(afterStaff),opts=null;
                if(hasExternal){var projected=preservedValuesAfterRevoke(tipoPg,stored,currentStaff),extLines=revokeExternalSummary(tipoPg,stored,currentStaff,projected),bounds=revokeBoundWarnings(tipoPg,stored,currentStaff),msg="Sono presenti variazioni successive all’accredito di "+(stored.monthName||mese.nome)+".\n\nLa revoca manterrà queste variazioni e rimuoverà soltanto l’effetto dell’accredito."+(extLines.length?"\n\n"+extLines.join("\n"):"")+(bounds.length?"\n\nATTENZIONE: "+bounds.join(", ")+" ha/hanno toccato un limite minimo o massimo. Verifica il risultato con la Scheda PG dopo la revoca.":"");if(!confirm(msg)){box.checked=true;box.disabled=false;return;}opts={preserveExternal:true,expectedCurrentValues:currentStaff,nextValues:projected};}
                promise=window.fbRevokeStaffMonth(accreditiCollection,pgEntry.id,currentEntry.key,stored.meseId?String(stored.meseId):"",opts);
              }
              else{promise=window.fbSetAccredito(accreditiCollection,pgEntry.id,""+mese.id,nuovoValore,pgEntry.data&&pgEntry.data._dbRevision,mese);}
              Promise.resolve(promise).then(function(res){
                if(res&&res.ok){delete accreditiCache[accreditiCollection+"__"+pgEntry.id];caricaTutto(function(){renderApp();});}
                else{box.checked=!nuovoValore;box.disabled=false;if(res&&res.code==="missing-values"){alert("Prima configura e salva i valori correnti da Scheda PG nella sezione dedicata.");}else{alert(applyErrorMessage(res&&res.code));}}
              });
            });
            chk.appendChild(box);
            chk.appendChild(statusLbl);
          }
          row.appendChild(chk);
          if(!isImportedStudentMonth(mese)){appendMonthCalculator(row,pgEntry,accreditiCollection,accreditiData,mese,tipoPg,postsMese,gMese,ppMese,box,statusLbl);}

          mesiWrap.appendChild(row);
        })(mesi[m]);
      }
      var oldTools=card.querySelector(".db-archive-tools.periodic-marker"); if(oldTools){oldTools.remove();}
      var holder=el("div","periodic-holder"); holder.classList.add("periodic-marker"); card.appendChild(holder); appendPeriodicArchiveTools(holder,pgEntry,accreditiCollection,accreditiData);
    }

    if(accreditiCache[cacheKey]){
      disegnaMesi(accreditiCache[cacheKey]);
    } else {
      mesiWrap.appendChild(el("p", "small-note", "Caricamento stato accrediti\u2026"));
      window.fbGetAccrediti(accreditiCollection, pgEntry.id).then(function(data){
        accreditiCache[cacheKey] = data;
        disegnaMesi(data);
      }).catch(function(e){console.error(e);mesiWrap.innerHTML="";mesiWrap.appendChild(el("p","archive-blocked","Impossibile caricare lo stato degli accrediti. Ricarica il pannello prima di effettuare modifiche."));});
    }

    appendHistoryTools(card,pgEntry,accreditiCollection);
    return card;
  }

  window.fbOnAuthChange = function(user){
    if(user && user.uid !== window.NARRATOR_UID){ loggedIn=false; alert("Questo account non è autorizzato come Narratore."); window.fbSignOut(); return; }
    loggedIn = !!user;
    if(loggedIn){ caricaTutto(function(){ renderApp(); }); } else { renderApp(); }
  };

  renderApp();

  var ffLastSentHeight=0, ffHeightTimer=0;
  function getFelixContentHeight(){
    var wrap=document.querySelector(".wrap");
    if(wrap){var r=wrap.getBoundingClientRect();return Math.max(1,Math.ceil(r.bottom-Math.min(0,r.top)));}
    return Math.max(1,Math.ceil(document.body?document.body.getBoundingClientRect().height:1));
  }
  function notifyParentHeight(force){
    if(window.parent===window){return;}
    var h=getFelixContentHeight();
    if(!force&&Math.abs(h-ffLastSentHeight)<2){return;}
    ffLastSentHeight=h;
    try{window.parent.postMessage({tipo:"felix-tool-height",tool:"narratore",height:h,altezza:h},"*");}catch(e){}
  }
  function scheduleParentHeight(){
    if(ffHeightTimer){clearTimeout(ffHeightTimer);}
    ffHeightTimer=setTimeout(function(){notifyParentHeight(false);},40);
  }
  if(typeof ResizeObserver!=="undefined"){
    new ResizeObserver(scheduleParentHeight).observe(document.querySelector(".wrap")||document.body||document.documentElement);
  }
  if(typeof MutationObserver!=="undefined"){
    var mt=document.querySelector(".wrap")||document.body;
    if(mt){new MutationObserver(scheduleParentHeight).observe(mt,{childList:true,subtree:true,attributes:true,characterData:true});}
  }
  window.addEventListener("resize",scheduleParentHeight);
  window.addEventListener("message",function(event){
    if(event.data&&event.data.tipo==="felix-tool-height-request"){notifyParentHeight(true);}
  });
  window.addEventListener("load",function(){
    notifyParentHeight(true);
    setTimeout(function(){notifyParentHeight(true);},120);
    setTimeout(function(){notifyParentHeight(true);},500);
  });

})();
</script>
</body>
</html>
